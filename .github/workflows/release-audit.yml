name: Nu App release audit

on:
  push:
    branches:
      - visual/claude-final-integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Use stable npm for CI
        run: npm install --global npm@11.6.0 --no-audit --no-fund

      - name: Install exact dependencies
        shell: bash
        env:
          npm_config_cache: /tmp/nu-app-npm-cache
        run: |
          set -euo pipefail
          node --version
          npm --version
          rm -rf node_modules /tmp/nu-app-npm-cache
          # Replit writes its internal npm proxy into package-lock.json.
          # GitHub cannot resolve package-firewall.replit.local, so normalize
          # only the runner copy while preserving versions and integrity hashes.
          sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
          npm ci --ignore-scripts --no-audit --no-fund --prefer-online --progress=false
          node -e "require.resolve('express'); require.resolve('pg'); require.resolve('web-push')"

      - name: Check JavaScript syntax
        run: |
          find . -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check scripts/release-static-audit.js

      - name: Audit static release references
        run: node scripts/release-static-audit.js

      - name: Run release unit tests
        shell: bash
        run: |
          mapfile -t TESTS < <(find tests -maxdepth 1 -type f -name '*.test.js' ! -name '*.integration.test.js' | sort)
          node --test "${TESTS[@]}" \
            pilot-crypto-v0.test.js \
            pilot-identity-routes-v0.test.js \
            pilot-identity-server-v0.test.js \
            pilot-identity-store-v0.test.js
