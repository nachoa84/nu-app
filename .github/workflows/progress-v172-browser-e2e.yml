name: V172 browser PWA recovery

on:
  push:
    branches:
      - work/progress-stabilization-v172
    paths:
      - index.html
      - app.js
      - backend-client.js
      - routine-active-sync-v172.js
      - routine-state.js
      - routine-sync.js
      - routine-products-v92.js
      - daily-view.js
      - progress-view.js
      - service-worker.js
      - server.js
      - tests/pwa-browser-recovery-v172.e2e.js
      - .github/workflows/progress-v172-browser-e2e.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-pwa-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nu_test
          POSTGRES_PASSWORD: nu_test
          POSTGRES_DB: nu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U nu_test -d nu_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      TEST_DATABASE_URL: postgresql://nu_test:nu_test@127.0.0.1:5432/nu_test
      DATABASE_URL: postgresql://nu_test:nu_test@127.0.0.1:5432/nu_test
      LEGACY_SCHEDULER_ENABLED: "false"
      ENABLE_ADMIN_TEST_ROUTES: "false"
      ENABLE_DEMO_ROUTES: "false"
      IRIS_AI_USER_ROUTE_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Normalize Replit registry references in runner copy
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json

      - name: Install exact app dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --prefer-online --progress=false

      - name: Install browser test dependency without changing the repository
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.55.0

      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Check focused syntax
        run: |
          node --check server.js
          node --check routine-active-sync-v172.js
          node --check backend-client.js
          node --check service-worker.js
          node --check tests/pwa-browser-recovery-v172.e2e.js

      - name: Run browser PWA recovery verification
        run: node tests/pwa-browser-recovery-v172.e2e.js

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v172-browser-pwa-evidence
          path: test-artifacts/v172-browser
          if-no-files-found: warn
          retention-days: 7
