name: Iris AI core v1

on:
  pull_request:
    paths:
      - "iris-ai-*.js"
      - "iris-retrieval-*.js"
      - "tests/iris-ai-*.test.js"
      - "tests/iris-retrieval-*.test.js"
      - ".github/workflows/iris-ai-core-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run Iris AI core unit tests
        shell: bash
        run: |
          mapfile -d '' test_files < <(
            find tests -maxdepth 1 -type f \
              \( -name 'iris-ai-*.test.js' -o -name 'iris-retrieval-*.test.js' \) \
              ! -name '*.integration.test.js' \
              -print0 | sort -z
          )

          if [ "${#test_files[@]}" -eq 0 ]; then
            echo "No Iris AI/retrieval unit tests found."
            exit 1
          fi

          printf 'Running %s unit test files:\n' "${#test_files[@]}"
          printf ' - %s\n' "${test_files[@]}"
          node --test "${test_files[@]}"
