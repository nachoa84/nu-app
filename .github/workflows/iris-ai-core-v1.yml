name: Iris AI core v1

on:
  pull_request:
    paths:
      - "iris-ai-provider-v1.js"
      - "iris-ai-orchestrator-v1.js"
      - "iris-ai-hardening-v1.js"
      - "iris-retrieval-query-prep-v1.js"
      - "iris-ai-policy-config-v1.js"
      - "iris-ai-policy-engine-v1.js"
      - "iris-ai-policy-runtime-v1.js"
      - "iris-ai-quota-store-v1.js"
      - "iris-ai-metrics-store-v1.js"
      - "tests/iris-ai-orchestrator-v1.test.js"
      - "tests/iris-ai-hardening-v1.test.js"
      - "tests/iris-retrieval-query-prep-v1.test.js"
      - "tests/iris-ai-policy-engine-v1.test.js"
      - "tests/iris-ai-quota-metrics-v1.test.js"
      - "tests/iris-ai-policy-runtime-integration-v1.test.js"
      - "tests/iris-ai-policy-runtime-unsafe-input-v1.test.js"
      - ".github/workflows/iris-ai-core-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run Iris AI core tests
        run: node --test tests/iris-ai-orchestrator-v1.test.js tests/iris-ai-hardening-v1.test.js tests/iris-retrieval-query-prep-v1.test.js tests/iris-ai-policy-engine-v1.test.js tests/iris-ai-quota-metrics-v1.test.js tests/iris-ai-policy-runtime-integration-v1.test.js tests/iris-ai-policy-runtime-unsafe-input-v1.test.js
