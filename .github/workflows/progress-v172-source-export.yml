name: V172 isolated source export
on:
  push:
    branches:
      - work/progress-stabilization-v172
    paths:
      - .github/workflows/progress-v172-source-export.yml
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact source and package
        run: |
          test "$(git hash-object backend-client.js)" = "fe5745f7f28b85632f3ad523be5c467acc65f5f9"
          git rev-parse HEAD > v172-source-sha.txt
          zip -q v172-source.zip backend-client.js index.html service-worker.js tests/routine-active-sync-v169.test.js v172-source-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: v172-source
          path: v172-source.zip
          retention-days: 1
