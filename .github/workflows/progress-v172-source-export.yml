name: V172 isolated source verification
on:
  push:
    branches:
      - work/progress-stabilization-v172
    paths:
      - .github/workflows/progress-v172-source-export.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compare source sections without artifacts
        run: |
          test "$(git hash-object backend-client.js)" = "fe5745f7f28b85632f3ad523be5c467acc65f5f9"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          s = Path('backend-client.js').read_text()
          a = s.index('  // NU APP · SINCRONIZACIÓN ACTIVA DE ESTADO V169')
          b = s.index('  window.BackendAPI = {', a)
          for name, part in [('prefix', s[:a]), ('legacy', s[a:b]), ('suffix', s[b:])]:
              print(name, len(part), hashlib.sha256(part.encode()).hexdigest())
          print('source_lines', len(s.splitlines()))
          PY
