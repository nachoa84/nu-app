name: iris-review-store-pr1

on:
  pull_request:
    branches:
      - main
    paths:
      - "iris-document-review-store-v1.js"
      - "tests/iris-document-review-store-v1.test.js"
      - "tests/iris-document-review-store-v1.integration.test.js"
      - "migration-iris-document-retrieval-v1.sql"
      - ".github/workflows/iris-review-store-pr1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: iris_test
          POSTGRES_PASSWORD: iris_test
          POSTGRES_DB: iris_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U iris_test -d iris_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: development
      IRIS_REVIEW_ENVIRONMENT: development
      IRIS_V1_TEST_DATABASE_URL: postgresql://iris_test:iris_test@127.0.0.1:5432/iris_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit test review store
        run: node --test tests/iris-document-review-store-v1.test.js

      - name: PostgreSQL integration test with rollback
        run: node --test tests/iris-document-review-store-v1.integration.test.js
