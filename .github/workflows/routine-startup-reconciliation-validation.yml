name: Routine startup reconciliation validation

on:
  pull_request:
    branches:
      - fix/routine-startup-reconciliation-v173
    paths:
      - "backend-client.js"
      - "routine-active-sync-v172.js"
      - "tests/routine-active-sync-v172.test.js"
      - "tests/routine-low-cost-startup-recovery-v173.test.js"
      - "tests/routine-recovery-flow-v172.integration.test.js"
      - ".github/workflows/routine-startup-reconciliation-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nu_test
          POSTGRES_PASSWORD: nu_test
          POSTGRES_DB: nu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U nu_test -d nu_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: development
      TEST_DATABASE_URL: postgresql://nu_test:nu_test@127.0.0.1:5432/nu_test
      DATABASE_URL: postgresql://nu_test:nu_test@127.0.0.1:5432/nu_test
      TEST_RECOVERY_PORT: "43173"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Normalize Replit npm URLs and install dependencies
        shell: bash
        run: |
          sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
          npm ci --ignore-scripts --no-audit --no-fund --prefer-online

      - name: Syntax check changed runtime files
        run: |
          node --check backend-client.js
          node --check routine-active-sync-v172.js

      - name: Run routine unit and audit tests
        run: |
          node --test \
            tests/routine-active-sync-v169.test.js \
            tests/routine-active-sync-v172.test.js \
            tests/routine-transition-guard-v172.test.js \
            tests/routine-low-cost-startup-recovery-v173.test.js \
            tests/routine-startup-reconciliation-v173.audit.test.js

      - name: Run routine PostgreSQL integrations
        run: |
          node --test \
            tests/routine-recovery-flow-v172.integration.test.js \
            tests/routine-transition-postgres-v172.integration.test.js
