<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fffaf6">
<title>Demo · Mis rutinas</title>
<style>
:root{
  --bg:#fffaf6;
  --text:#2d211c;
  --muted:#75645b;
  --accent:#e3542c;
  --accent2:#cf4a27;
  --line:rgba(92,64,50,.10);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100dvh;
  display:grid;
  place-items:center;
  padding:18px;
  background:#eee9e5;
  font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}
button{font:inherit}
.phone{
  width:min(100%,390px);
  height:min(844px,calc(100dvh - 36px));
  min-height:730px;
  position:relative;
  overflow:hidden;
  border-radius:38px;
  background:
    radial-gradient(circle at 88% 2%,rgba(246,226,213,.24),transparent 25%),
    linear-gradient(180deg,#fffdfb 0%,var(--bg) 100%);
  box-shadow:0 26px 72px rgba(61,42,33,.18),inset 0 0 0 1px rgba(75,51,40,.06);
}
.status{
  height:42px;
  padding:14px 22px 0;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  font-size:13px;
  font-weight:760;
}
.status-right{display:flex;align-items:center;gap:7px}
.screen{
  height:calc(100% - 42px);
  overflow:auto;
  padding:13px 16px 108px;
  scrollbar-width:none;
}
.screen::-webkit-scrollbar{display:none}
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  margin-bottom:7px;
}
.header h1{
  margin:0;
  font-size:25px;
  line-height:1;
  font-weight:850;
  letter-spacing:-.045em;
}
.bell{
  width:42px;height:42px;border:0;background:transparent;
  display:grid;place-items:center;color:#49372f;
}
.bell svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.subtitle{
  margin:0 0 20px;
  color:#55473f;
  font-size:12.5px;
  line-height:1.4;
}

.card{
  position:relative;
  min-height:197px;
  overflow:hidden;
  margin-bottom:12px;
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:0 10px 28px rgba(75,50,38,.055);
  isolation:isolate;
}
.card.collagen{
  background:linear-gradient(135deg,#ffe4d5 0%,#fff3eb 47%,#fde7da 100%);
}
.card.lumispa{
  background:linear-gradient(135deg,#e6f5fb 0%,#f8fcfd 52%,#e1eef3 100%);
}
.card-media{
  position:absolute;
  inset:0;
  z-index:0;
  overflow:hidden;
  pointer-events:none;
}
.card-media img{
  display:block;
  position:absolute;
}
.collagen-photo{
  width:61%;
  height:72%;
  right:-4%;
  top:18%;
  object-fit:cover;
  object-position:50% 48%;
  border-radius:44% 0 0 0;
  opacity:.92;
  filter:saturate(.95) contrast(.96) brightness(1.06);
  mix-blend-mode:multiply;
}
.collagen-photo-fade{
  position:absolute;inset:0;z-index:1;
  background:
    linear-gradient(90deg,#ffe4d5 0%,rgba(255,236,225,.96) 33%,rgba(255,239,229,.40) 57%,rgba(255,241,233,.02) 78%),
    linear-gradient(180deg,rgba(255,250,246,.10),rgba(255,240,230,.08));
}
.lumispa-photo{
  width:58%;
  height:88%;
  right:-2%;
  top:10%;
  object-fit:contain;
  object-position:center;
  mix-blend-mode:multiply;
  filter:saturate(1.05) contrast(.98) brightness(1.02);
}
.lumispa-photo-fade{
  position:absolute;inset:0;z-index:1;
  background:linear-gradient(90deg,#e6f5fb 0%,rgba(239,249,252,.96) 38%,rgba(245,251,252,.32) 64%,rgba(255,255,255,0) 85%);
}
.card-content{
  position:relative;
  z-index:3;
  padding:15px 13px 13px;
}
.card-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  min-height:57px;
}
.title{
  margin:0;
  font-size:23px;
  line-height:1;
  font-weight:860;
  letter-spacing:-.045em;
}
.days{
  margin-top:7px;
  font-size:12.5px;
  font-weight:700;
  color:#4a3930;
}
.pill{
  padding:8px 13px;
  border-radius:999px;
  background:rgba(255,255,255,.88);
  box-shadow:0 7px 18px rgba(64,43,34,.06);
  font-size:10px;
  font-weight:730;
  color:#4b3b33;
}
.progress-box{
  width:64%;
  margin-top:27px;
}
.progress-copy{
  margin:0 0 8px;
  font-size:12.5px;
  font-weight:770;
  color:#46362e;
}
.bar{
  width:100%;
  height:5px;
  border-radius:999px;
  background:rgba(255,255,255,.90);
  overflow:hidden;
}
.bar span{
  display:block;height:100%;border-radius:inherit;background:var(--accent);
}
.cta{
  width:100%;
  height:48px;
  margin-top:16px;
  border:0;
  border-radius:8px;
  color:white;
  background:linear-gradient(180deg,#e65a32 0%,#d94f29 100%);
  font-size:13px;
  font-weight:790;
  box-shadow:0 7px 15px rgba(207,72,36,.13);
}
.explore{
  width:100%;
  min-height:60px;
  display:flex;
  align-items:center;
  gap:14px;
  padding:10px 14px;
  margin-top:2px;
  border:1px dashed rgba(224,111,72,.40);
  border-radius:15px;
  background:rgba(255,252,249,.76);
  color:#4b3a32;
}
.explore-icon{
  width:37px;height:37px;display:grid;place-items:center;color:#9c8a80;
}
.explore-icon svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.explore strong{display:block;font-size:12px;margin-bottom:3px}
.explore small{display:block;color:#99877e;font-size:9.5px}
.nav{
  position:absolute;left:0;right:0;bottom:0;
  height:88px;
  padding:10px 18px max(11px,env(safe-area-inset-bottom));
  display:grid;
  grid-template-columns:repeat(4,1fr);
  align-items:center;
  border-top:1px solid rgba(91,65,53,.08);
  background:rgba(255,253,251,.95);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}
.nav button{
  border:0;background:transparent;
  display:grid;justify-items:center;gap:4px;
  color:#87766d;
  font-size:9.5px;
  font-weight:650;
}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav .active{color:var(--accent);font-weight:760}
.nav .active .fill{fill:currentColor;stroke:currentColor}
@media(max-width:460px){
  body{padding:0;background:var(--bg)}
  .phone{width:100%;height:100dvh;min-height:100dvh;border-radius:0;box-shadow:none}
}
</style>
</head>
